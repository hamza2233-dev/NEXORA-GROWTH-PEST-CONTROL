<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora Growth - TrackDrive Ping & Post</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-center items-center p-4">

    <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl shadow-xl overflow-hidden">
        <!-- Header -->
        <div class="bg-gradient-to-r from-emerald-600 to-teal-600 p-6 text-center relative">
            <div class="absolute top-3 right-3 flex items-center space-x-1.5 bg-black/20 backdrop-blur-md px-2.5 py-1 rounded-full text-xs font-medium text-emerald-200 border border-emerald-400/30">
                <span id="status-dot" class="w-2 h-2 rounded-full bg-emerald-300 animate-pulse"></span>
                <span id="status-text">Ready</span>
            </div>
            <h1 class="text-xl font-bold tracking-wide text-white uppercase"><i class="fa-solid fa-bug mr-2"></i>Nexora Growth</h1>
            <p class="text-xs text-emerald-100 mt-1">TrackDrive Automated Ping & Post Dispatcher</p>
        </div>

        <!-- Form Body -->
        <form id="dispatchForm" class="p-6 space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">
                    <i class="fa-solid fa-phone-volume mr-1.5 text-emerald-600"></i> Caller ID (CID)
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 font-mono text-sm">+1</span>
                    <input type="tel" id="caller_id" name="caller_id" required placeholder="5551234567" 
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 pl-10 pr-4 text-slate-800 placeholder-slate-400 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition font-mono text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">
                    <i class="fa-solid fa-stopwatch mr-1.5 text-emerald-600"></i> Auto Loop Interval
                </label>
                <select id="auto_interval" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 text-slate-800 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition text-sm">
                    <option value="0">Manual / Off</option>
                    <option value="5">Every 5 Seconds</option>
                    <option value="10" selected>Every 10 Seconds</option>
                </select>
            </div>

            <div class="pt-2">
                <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-600/20 transition duration-200 flex items-center justify-center space-x-2 text-sm">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span id="btnText">Run Ping & Post</span>
                </button>
            </div>
        </form>

        <!-- Response Console -->
        <div id="responseBox" class="hidden mx-6 mb-6 p-4 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-700 space-y-3">
            <div class="flex items-center justify-between pb-2 border-b border-slate-200 text-slate-400 font-mono">
                <span id="consoleTitle">Response Log</span>
                <span id="responseTimestamp">--:--:--</span>
            </div>
            
            <!-- DID Display & Copy Action -->
            <div id="didContainer" class="hidden flex items-center justify-between bg-emerald-50 border border-emerald-100 p-2.5 rounded-lg">
                <div class="font-mono text-emerald-900 font-medium">
                    <span class="text-slate-500 text-[10px] block uppercase">Target Phone Number</span>
                    <span id="didText" class="text-sm">--</span>
                </div>
                <button type="button" id="copyDidBtn" onclick="copyDid()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded-md transition flex items-center space-x-1.5 shadow-sm">
                    <i class="fa-regular fa-copy"></i>
                    <span id="copyBtnText">Copy Number</span>
                </button>
            </div>

            <div id="responseContent" class="overflow-x-auto whitespace-pre-wrap break-all font-mono text-slate-600"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('dispatchForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        const responseBox = document.getElementById('responseBox');
        const responseContent = document.getElementById('responseContent');
        const responseTimestamp = document.getElementById('responseTimestamp');
        const autoIntervalSelect = document.getElementById('auto_interval');
        const didContainer = document.getElementById('didContainer');
        const didText = document.getElementById('didText');
        const copyBtnText = document.getElementById('copyBtnText');

        let autoPingTimer = null;
        let lastExtractedDid = '';

        const stopAutoPing = () => {
            if (autoPingTimer) {
                clearInterval(autoPingTimer);
                autoPingTimer = null;
            }
            autoIntervalSelect.value = "0";
        };

        const speakText = (txt) => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(txt);
                utterance.rate = 1.1;
                utterance.pitch = 1.2;
                window.speechSynthesis.speak(utterance);
            }
        };

        const executePingAndPost = async () => {
            let rawPhone = document.getElementById('caller_id').value.trim();
            if (!rawPhone) return;

            let formattedPhone = rawPhone.startsWith('+1') ? rawPhone : '+1' + rawPhone.replace(/^\+/, '');

            statusText.textContent = "Pinging...";
            statusText.className = "text-xs font-medium text-amber-200";
            statusDot.className = "w-2 h-2 rounded-full bg-amber-400 animate-ping";
            btnText.textContent = "Processing Ping...";
            submitBtn.disabled = true;

            try {
                // STEP 1: Send PING Request
                const pingResponse = await fetch('/api/trackdrive', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'ping', caller_id: formattedPhone })
                });

                const pingResultText = await pingResponse.text();
                responseBox.classList.remove('hidden');
                responseTimestamp.textContent = new Date().toLocaleTimeString();

                let pingJson;
                try {
                    pingJson = JSON.parse(pingResultText);
                } catch (err) {
                    throw new Error("Invalid JSON response from Ping: " + pingResultText);
                }

                // Check TrackDrive Success criteria (usually success: true or valid ping_id / match)
                const pingId = pingJson.ping_id || pingJson.id || pingJson.pingId;
                const isSuccessful = pingJson.success === true || pingJson.matched === true || pingId;

                if (!isSuccessful) {
                    responseContent.textContent = "Ping Rejected / No Match:\n" + JSON.stringify(pingJson, null, 2);
                    statusText.textContent = "No Match";
                    statusText.className = "text-xs font-medium text-rose-200";
                    statusDot.className = "w-2 h-2 rounded-full bg-rose-400";
                    submitBtn.disabled = false;
                    btnText.textContent = "Run Ping & Post";
                    return;
                }

                // STEP 2: Automatically ROLL OVER to POST using captured ping_id
                statusText.textContent = "Posting...";
                btnText.textContent = "Executing Post...";

                const postResponse = await fetch('/api/trackdrive', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        action: 'post', 
                        caller_id: formattedPhone,
                        ping_id: pingId
                    })
                });

                const postResultText = await postResponse.text();
                let postJson;
                try {
                    postJson = JSON.parse(postResultText);
                } catch (err) {
                    postJson = { rawResponse: postResultText };
                }

                responseContent.textContent = "--- PING RESULT ---\n" + JSON.stringify(pingJson, null, 2) + 
                                            "\n\n--- POST RESULT ---\n" + JSON.stringify(postJson, null, 2);

                // Extract dynamic target phone number if provided in post/ping response
                let rawNum = postJson.phone_number || postJson.dynamicPhoneNumber || pingJson.phone_number;
                if (rawNum) {
                    let cleanNum = rawNum.replace(/^\+/, '');
                    if (cleanNum.startsWith('1') && cleanNum.length === 11) {
                        cleanNum = cleanNum.substring(1);
                    }
                    lastExtractedDid = cleanNum;
                    didText.textContent = lastExtractedDid;
                    didContainer.classList.remove('hidden');
                    
                    stopAutoPing();
                    speakSuccess();
                } else {
                    didContainer.classList.add('hidden');
                    speakSuccess();
                }

                statusText.textContent = "Success";
                statusText.className = "text-xs font-medium text-emerald-200";
                statusDot.className = "w-2 h-2 rounded-full bg-emerald-300";

            } catch (error) {
                responseBox.classList.remove('hidden');
                responseTimestamp.textContent = new Date().toLocaleTimeString();
                responseContent.textContent = "Error: " + error.message;
                didContainer.classList.add('hidden');
                
                statusText.textContent = "Error";
                statusText.className = "text-xs font-medium text-rose-200";
                statusDot.className = "w-2 h-2 rounded-full bg-rose-400";
            } finally {
                btnText.textContent = "Run Ping & Post";
                submitBtn.disabled = false;
            }
        };

        const copyDid = () => {
            if (!lastExtractedDid) return;
            navigator.clipboard.writeText(lastExtractedDid).then(() => {
                copyBtnText.textContent = "Copied!";
                setTimeout(() => { copyBtnText.textContent = "Copy Number"; }, 2000);
            });
        };

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            executePingAndPost();
        });

        autoIntervalSelect.addEventListener('change', (e) => {
            if (autoPingTimer) {
                clearInterval(autoPingTimer);
                autoPingTimer = null;
            }

            const intervalSeconds = parseInt(e.target.value);
            if (intervalSeconds > 0) {
                autoPingTimer = setInterval(() => {
                    const phoneVal = document.getElementById('caller_id').value.trim();
                    if (phoneVal) {
                        executePingAndPost();
                    }
                }, intervalSeconds * 1000);
            }
        });
    </script>
</body>
</html>
